name: Returning identical root clone
on:
  push:
    branches: [main]
    paths:
      - 'loader/**'
      - 'payload/memory_probe*'
      - 'payload/root_clone*'
      - 'payload/raw_journal*'
      - 'payload/probe_start.S'
      - 'tests/test_raw_journal.c'
      - 'payload/probe_log.h'
      - 'tools/build_workspace_probe.sh'
      - 'tools/test_native_core.sh'
      - 'tests/test_root_clone.c'
      - 'docs/ROOT_CLONE.md'
      - '.github/workflows/root-clone.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - name: Test snapshot gates and existing preparation
        run: sh tools/test_native_core.sh
      - name: Fetch pinned SDK
        run: |
          git clone https://github.com/Scene-Collective/ps4-payload-sdk.git dumper-sdk
          git -C dumper-sdk checkout b7326416c23ce14639e9180a24093bdc5eedb579
      - name: Build one returning console test
        run: sh tools/build_workspace_probe.sh dumper-sdk "$GITHUB_SHA" root-clone
      - uses: actions/upload-artifact@v4
        with:
          name: PS4-Windows-Loader-Root-Clone-${{ matrix.cc }}
          path: build/root-clone/
          retention-days: 30
