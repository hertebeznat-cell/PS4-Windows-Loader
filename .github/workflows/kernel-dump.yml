name: Experimental kernel dump
on:
  push:
    branches: [main]
    paths:
      - 'payload/kernel_dump.c'
      - 'payload/dump_checks.h'
      - 'tests/test_dump_checks.c'
      - 'tools/build_kernel_dump.sh'
      - 'docs/KERNEL_DUMP.md'
      - '.github/workflows/kernel-dump.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test bounded dump metadata
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/test_dump_checks.c -o /tmp/test-dump
          /tmp/test-dump
      - name: Fetch pinned external SDK
        run: |
          git clone https://github.com/Scene-Collective/ps4-payload-sdk.git dumper-sdk
          git -C dumper-sdk checkout b7326416c23ce14639e9180a24093bdc5eedb579
          test "$(git -C dumper-sdk rev-parse HEAD)" = b7326416c23ce14639e9180a24093bdc5eedb579
      - name: Build separate diagnostic
        run: sh tools/build_kernel_dump.sh dumper-sdk "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: PS4-Windows-Loader-Kernel-Dump-Experimental
          path: build/kernel-dump/
          retention-days: 30
