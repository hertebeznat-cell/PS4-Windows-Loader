name: PS4 Windows Loader CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  PS4_LOADER_COMMIT: f70f43a60a973b3662daeb29c1f115d95408db93
  LATEST_STAGE: stage4_8

jobs:
  stage0-core:
    name: Verify portable core
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld
      - name: Compile loader core
        run: |
          mkdir -p build
          clang -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -ffreestanding -fno-stack-protector -fno-builtin \
            -Iloader/include -c loader/src/main.c -o build/ps4wl-main.o
      - name: Inspect object
        run: |
          file build/ps4wl-main.o
          llvm-readelf -h build/ps4wl-main.o
          llvm-nm -g build/ps4wl-main.o
      - name: Compile handoff layout validator
        run: |
          clang -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -ffreestanding -fno-stack-protector -fno-builtin \
            -Iloader/include -c loader/src/handoff.c -o build/ps4wl-handoff.o
      - name: Test physical memory placement
        run: |
          clang -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Iloader/include loader/src/handoff.c tests/test_handoff.c \
            -o build/test-handoff
          ./build/test-handoff
      - name: Test portable PE headers
        run: |
          clang -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Iloader/include loader/src/main.c tests/test_pe.c \
            -o build/test-pe
          ./build/test-pe

  ps4-loader:
    name: Build latest PS4 loader
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install PS4 loader toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils git python3 yasm
      - name: Fetch pinned PS4 loader runtime
        run: |
          git clone https://github.com/ps4-linux/ps4-linux-loader.git ps4-runtime
          git -C ps4-runtime checkout "$PS4_LOADER_COMMIT"
          git -C ps4-runtime rev-parse HEAD | tee PS4_RUNTIME_COMMIT.txt
      - name: Build PS4 freestanding runtime
        run: make -C ps4-runtime/lib
      - name: Test PE parser used by latest payload
        run: |
          mkdir -p build
          gcc -std=c11 -ffunction-sections -fdata-sections \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -isystem ps4-runtime/freebsd-headers \
            -Wl,--gc-sections tests/test_stage_pe.c \
            -o build/test-stage-pe
          ./build/test-stage-pe
      - name: Build latest loader
        run: |
          mkdir -p build/latest
          gcc \
            -isystem ps4-runtime/freebsd-headers \
            -nostdinc -nostdlib \
            -fno-stack-protector -fno-builtin \
            -static -fPIE -ffreestanding \
            -DSTAGE4_1_NO_MAIN=1 \
            -DSTAGE4_3_NO_MAIN=1 \
            "-DPS4WL_BUILD_ID=\"${GITHUB_SHA}\"" \
            ps4-runtime/lib/lib.a "payload/${LATEST_STAGE}.c" \
            -Wl,-gc-sections \
            -o build/latest/PS4WindowsLoader-latest.elf
          objcopy build/latest/PS4WindowsLoader-latest.elf \
            --only-section .text \
            --only-section .data \
            --only-section .bss \
            --only-section .rodata \
            -O binary \
            build/latest/PS4WindowsLoader-latest.bin
      - name: Inspect latest loader
        run: |
          file build/latest/PS4WindowsLoader-latest.elf
          readelf -h build/latest/PS4WindowsLoader-latest.elf
          strings build/latest/PS4WindowsLoader-latest.elf | grep -Fq 'MODE: PREFLIGHT_ONLY; Boot Manager entry disabled'
          ls -lh build/latest/PS4WindowsLoader-latest.*
          sha256sum build/latest/PS4WindowsLoader-latest.bin | tee build/latest/SHA256SUMS.txt
          cp PS4_RUNTIME_COMMIT.txt build/latest/
          printf '%s\n' "$LATEST_STAGE" > build/latest/STAGE.txt
          printf '%s\n' "$GITHUB_SHA" > build/latest/COMMIT.txt
      - name: Upload latest loader
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Windows-Loader-Latest
          path: build/latest/
          retention-days: 30
