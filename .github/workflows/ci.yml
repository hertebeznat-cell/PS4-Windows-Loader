name: PS4 Windows Loader CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  PS4_LOADER_COMMIT: f70f43a60a973b3662daeb29c1f115d95408db93
  LATEST_STAGE: stage4_8

jobs:
  stage0-core:
    name: Verify portable core
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld
      - name: Compile loader core
        run: |
          mkdir -p build
          clang -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -ffreestanding -fno-stack-protector -fno-builtin \
            -Iloader/include -c loader/src/main.c -o build/ps4wl-main.o
      - name: Inspect object
        run: |
          file build/ps4wl-main.o
          llvm-readelf -h build/ps4wl-main.o
          llvm-nm -g build/ps4wl-main.o
      - name: Compile handoff layout validator
        run: |
          clang -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -ffreestanding -fno-stack-protector -fno-builtin \
            -Iloader/include -c loader/src/handoff.c -o build/ps4wl-handoff.o
      - name: Test physical memory placement
        run: |
          clang -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Iloader/include loader/src/handoff.c tests/test_handoff.c \
            -o build/test-handoff
          ./build/test-handoff
      - name: Compile and test handoff page mappings
        run: |
          clang -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -ffreestanding -fno-stack-protector -fno-builtin \
            -Iloader/include -c loader/src/paging.c -o build/ps4wl-paging.o
          clang -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Iloader/include loader/src/handoff.c loader/src/paging.c \
            tests/test_paging.c -o build/test-paging
          ./build/test-paging
      - name: Test portable PE headers
        run: |
          clang -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Iloader/include loader/src/main.c tests/test_pe.c \
            -o build/test-pe
          ./build/test-pe
      - name: Test CPU log analysis
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_cpu_log.py
      - name: Test returning context probe without kernel entry
        run: |
          clang -std=c11 -Wall -Wextra -Wpedantic -Werror \
            tests/test_context_capture.c payload/context_capture.S \
            -o build/test-context-capture
          ./build/test-context-capture
          clang -std=c11 -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_context_probe.c payload/context_capture.S \
            -o build/test-context-probe
          ./build/test-context-probe

  ps4-loader:
    name: Build latest PS4 loader
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install PS4 loader toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils git python3 yasm
      - name: Fetch pinned PS4 loader runtime
        run: |
          git clone https://github.com/ps4-linux/ps4-linux-loader.git ps4-runtime
          git -C ps4-runtime checkout "$PS4_LOADER_COMMIT"
          git -C ps4-runtime rev-parse HEAD | tee PS4_RUNTIME_COMMIT.txt
      - name: Build PS4 freestanding runtime
        run: make -C ps4-runtime/lib
      - name: Test standalone CPU log format on CI host
        run: |
          mkdir -p build
          gcc -std=c11 \
            '-DPS4WL_CPU_LOG_PATH="build/CPU-PROBE-TEST.LOG"' \
            payload/cpu_probe.c -o build/test-cpu-probe
          ./build/test-cpu-probe
          python3 tools/check_cpu_log.py build/CPU-PROBE-TEST.LOG
          gcc -std=c11 '-DPS4WL_CPU_LOG_PATH="/dev/full"' \
            payload/cpu_probe.c -o build/test-cpu-write-failure
          if ./build/test-cpu-write-failure; then
            echo 'CPU probe did not report a write failure' >&2
            exit 1
          fi
      - name: Test PE parser used by latest payload
        run: |
          mkdir -p build
          gcc -std=c11 -ffunction-sections -fdata-sections \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -isystem ps4-runtime/freebsd-headers \
            -Wl,--gc-sections tests/test_stage_pe.c \
            -o build/test-stage-pe
          ./build/test-stage-pe
      - name: Build latest loader
        run: |
          mkdir -p build/latest
          gcc \
            -isystem ps4-runtime/freebsd-headers \
            -nostdinc -nostdlib \
            -fno-stack-protector -fno-builtin \
            -static -fPIE -ffreestanding \
            -DSTAGE4_1_NO_MAIN=1 \
            -DSTAGE4_3_NO_MAIN=1 \
            "-DPS4WL_BUILD_ID=\"${GITHUB_SHA}\"" \
            ps4-runtime/lib/lib.a "payload/${LATEST_STAGE}.c" \
            -Wl,-gc-sections \
            -o build/latest/PS4WindowsLoader-latest.elf
          objcopy build/latest/PS4WindowsLoader-latest.elf \
            --only-section .text \
            --only-section .data \
            --only-section .bss \
            --only-section .rodata \
            -O binary \
            build/latest/PS4WindowsLoader-latest.bin
      - name: Inspect latest loader
        run: |
          file build/latest/PS4WindowsLoader-latest.elf
          readelf -h build/latest/PS4WindowsLoader-latest.elf
          strings build/latest/PS4WindowsLoader-latest.elf | grep -Fq 'MODE: PREFLIGHT_ONLY; Boot Manager entry disabled'
          strings build/latest/PS4WindowsLoader-latest.elf | grep -Fq 'CPU48: CPUID raw registers begin'
          ls -lh build/latest/PS4WindowsLoader-latest.*
          (cd build/latest && sha256sum PS4WindowsLoader-latest.bin PS4WindowsLoader-latest.elf > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          cp PS4_RUNTIME_COMMIT.txt build/latest/
          printf '%s\n' "$LATEST_STAGE" > build/latest/STAGE.txt
          printf '%s\n' "$GITHUB_SHA" > build/latest/COMMIT.txt
      - name: Build standalone PS4 CPU probe
        run: |
          mkdir -p build/cpu-probe
          gcc -isystem ps4-runtime/freebsd-headers \
            -nostdinc -nostdlib -fno-stack-protector -fno-builtin \
            -static -fPIE -ffreestanding \
            "-DPS4WL_BUILD_ID=\"${GITHUB_SHA}\"" \
            ps4-runtime/lib/lib.a payload/cpu_probe.c \
            -Wl,-gc-sections -o build/cpu-probe/PS4WindowsLoader-CPU-Probe.elf
          objcopy build/cpu-probe/PS4WindowsLoader-CPU-Probe.elf \
            --only-section .text --only-section .data \
            --only-section .bss --only-section .rodata -O binary \
            build/cpu-probe/PS4WindowsLoader-CPU-Probe.bin
          strings build/cpu-probe/PS4WindowsLoader-CPU-Probe.elf | grep -Fq 'MODE: CPU_ONLY; no EFI or Boot Manager entry'
          (cd build/cpu-probe && sha256sum PS4WindowsLoader-CPU-Probe.bin PS4WindowsLoader-CPU-Probe.elf > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          printf '%s\n' "$GITHUB_SHA" > build/cpu-probe/COMMIT.txt
      - name: Upload latest loader
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Windows-Loader-Latest
          path: build/latest/
          retention-days: 30
      - name: Build returning CPU context probe
        run: |
          mkdir -p build/context-probe
          gcc -Wall -Wextra -Werror -isystem ps4-runtime/freebsd-headers \
            -nostdinc -nostdlib -fno-stack-protector -fno-builtin \
            -mno-red-zone -mgeneral-regs-only -static -fPIE -ffreestanding \
            "-DPS4WL_BUILD_ID=\"${GITHUB_SHA}\"" \
            ps4-runtime/lib/lib.a payload/context_probe.c payload/context_capture.S \
            -Wl,-gc-sections -o build/context-probe/PS4WindowsLoader-Context-Probe.elf
          objcopy build/context-probe/PS4WindowsLoader-Context-Probe.elf \
            --only-section .text --only-section .data \
            --only-section .bss --only-section .rodata -O binary \
            build/context-probe/PS4WindowsLoader-Context-Probe.bin
          objdump -d --disassemble=pwl_context_capture \
            build/context-probe/PS4WindowsLoader-Context-Probe.elf \
            > build/context-probe/CALLBACK-DISASSEMBLY.txt
          python3 tools/check_context_link.py \
            build/context-probe/PS4WindowsLoader-Context-Probe.elf
          (cd build/context-probe && sha256sum PS4WindowsLoader-Context-Probe.bin PS4WindowsLoader-Context-Probe.elf > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          cp PS4_RUNTIME_COMMIT.txt build/context-probe/
          cp docs/CONTEXT_PROBE.md build/context-probe/README.md
          printf '%s\n' "$GITHUB_SHA" > build/context-probe/COMMIT.txt
      - name: Upload returning CPU context probe
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Windows-Loader-Context-Probe
          path: build/context-probe/
          retention-days: 30
      - name: Upload standalone CPU probe
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Windows-Loader-CPU-Probe
          path: build/cpu-probe/
          retention-days: 30
