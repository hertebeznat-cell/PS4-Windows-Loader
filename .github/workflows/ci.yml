name: PS4 Windows Loader CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  PS4_LOADER_COMMIT: f70f43a60a973b3662daeb29c1f115d95408db93

jobs:
  stage0-core:
    name: Build Stage 0 portable core
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld
      - name: Compile loader core
        run: |
          mkdir -p build
          clang -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -ffreestanding -fno-stack-protector -fno-builtin \
            -Iloader/include -c loader/src/main.c -o build/ps4wl-main.o
      - name: Inspect object
        run: |
          file build/ps4wl-main.o
          llvm-readelf -h build/ps4wl-main.o
          llvm-nm -g build/ps4wl-main.o
      - name: Upload Stage 0 object
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Windows-Loader-Stage0
          path: build/ps4wl-main.o
          retention-days: 30

  ps4-payloads:
    name: Build PS4 payloads
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install PS4 payload toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils git python3 yasm
      - name: Fetch pinned PS4 payload runtime
        run: |
          git clone https://github.com/ps4-linux/ps4-linux-loader.git ps4-runtime
          git -C ps4-runtime checkout "$PS4_LOADER_COMMIT"
          git -C ps4-runtime rev-parse HEAD | tee PS4_RUNTIME_COMMIT.txt
      - name: Build PS4 freestanding runtime
        run: make -C ps4-runtime/lib

      - name: Link payload ELFs
        run: |
          for stage in stage1 stage2 stage2_2 stage2_3; do
            mkdir -p "build/$stage"
            src="payload/$stage.c"
            out="build/$stage/PS4WindowsLoader-$stage.elf"
            gcc \
              -isystem ps4-runtime/freebsd-headers \
              -nostdinc -nostdlib \
              -fno-stack-protector -fno-builtin \
              -static -fPIE -ffreestanding \
              ps4-runtime/lib/lib.a "$src" \
              -Wl,-gc-sections -o "$out"
          done

      - name: Convert ELFs to PS4 payload BINs
        run: |
          for stage in stage1 stage2 stage2_2 stage2_3; do
            objcopy "build/$stage/PS4WindowsLoader-$stage.elf" \
              --only-section .text \
              --only-section .data \
              --only-section .bss \
              --only-section .rodata \
              -O binary "build/$stage/PS4WindowsLoader-$stage.bin"
          done

      - name: Inspect payloads
        run: |
          for stage in stage1 stage2 stage2_2 stage2_3; do
            file "build/$stage/PS4WindowsLoader-$stage.elf"
            readelf -h "build/$stage/PS4WindowsLoader-$stage.elf"
            ls -lh "build/$stage/PS4WindowsLoader-$stage."*
            sha256sum "build/$stage/PS4WindowsLoader-$stage.bin" | tee "build/$stage/SHA256SUMS.txt"
            cp PS4_RUNTIME_COMMIT.txt "build/$stage/"
          done

      - name: Upload Stage 1 payload
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Windows-Loader-Stage1
          path: build/stage1/
          retention-days: 30

      - name: Upload Stage 2 payload
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Windows-Loader-Stage2
          path: build/stage2/
          retention-days: 30

      - name: Upload Stage 2.2 payload
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Windows-Loader-Stage2.2
          path: build/stage2_2/
          retention-days: 30

      - name: Upload Stage 2.3 payload
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Windows-Loader-Stage2.3
          path: build/stage2_3/
          retention-days: 30
