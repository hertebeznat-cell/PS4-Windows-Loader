name: Experimental resident preparation probe
on:
  push:
    branches: [main]
    paths:
      - 'loader/**'
      - 'payload/memory_probe*'
      - 'payload/workspace*'
      - 'payload/probe_log.h'
      - 'tools/*resident*'
      - 'tools/build_workspace_probe.sh'
      - 'tests/test_resident_services.c'
      - 'tests/test_probe_log.c'
      - 'tests/test_native_workspace.c'
      - 'tests/test_workspace_probe_core.c'
      - 'docs/RESIDENT_PROBE.md'
      - '.github/workflows/resident-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test copied resident code and physical preparation
        run: |
          sh tools/test_native_core.sh
          sh tools/test_resident_probe_core.sh
      - name: Fetch pinned SDK
        run: |
          git clone https://github.com/Scene-Collective/ps4-payload-sdk.git dumper-sdk
          git -C dumper-sdk checkout b7326416c23ce14639e9180a24093bdc5eedb579
      - name: Build returning resident experiment
        run: sh tools/build_workspace_probe.sh dumper-sdk "$GITHUB_SHA" resident
      - uses: actions/upload-artifact@v4
        with:
          name: PS4-Windows-Loader-Resident-Probe-Experimental
          path: build/resident-probe/
          retention-days: 30
