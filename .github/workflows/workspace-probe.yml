name: Experimental workspace probe
on:
  push:
    branches: [main]
    paths:
      - 'payload/memory_probe*'
      - 'payload/workspace*'
      - 'payload/probe_linker.ld'
      - 'loader/**'
      - 'tools/build_workspace_probe.sh'
      - 'tools/test_workspace_probe_core.sh'
      - 'tests/test_workspace_probe_core.c'
      - 'docs/WORKSPACE_PROBE.md'
      - '.github/workflows/workspace-probe.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test preparation and cleanup failures
        run: sh tools/test_workspace_probe_core.sh
      - name: Fetch pinned SDK
        run: |
          git clone https://github.com/Scene-Collective/ps4-payload-sdk.git dumper-sdk
          git -C dumper-sdk checkout b7326416c23ce14639e9180a24093bdc5eedb579
      - name: Build returning preparation experiment
        run: sh tools/build_workspace_probe.sh dumper-sdk "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: PS4-Windows-Loader-Workspace-Probe-Experimental
          path: build/workspace-probe/
          retention-days: 30
