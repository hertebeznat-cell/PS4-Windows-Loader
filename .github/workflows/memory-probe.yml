name: Experimental memory probe
on:
  push:
    branches: [main]
    paths:
      - 'payload/memory_probe*'
      - 'payload/probe_linker.ld'
      - 'tools/build_memory_probe.sh'
      - 'tools/build_kernel_dump.sh'
      - 'docs/MEMORY_PROBE.md'
      - '.github/workflows/memory-probe.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned SDK
        run: |
          git clone https://github.com/Scene-Collective/ps4-payload-sdk.git dumper-sdk
          git -C dumper-sdk checkout b7326416c23ce14639e9180a24093bdc5eedb579
      - name: Build returning experiment and verify binary layout
        run: sh tools/build_memory_probe.sh dumper-sdk "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: PS4-Windows-Loader-Memory-Probe-Experimental
          path: build/memory-probe/
          retention-days: 30
